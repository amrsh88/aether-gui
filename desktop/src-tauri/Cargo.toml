[package]
name = "aether-gui"
version = "1.0.0"
description = "Aether GUI by NetRepublic — a modern Windows client for the Aether core"
authors = ["Amirreza (NetRepublic)"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The Aether core, linked as a library rather than spawned as a child process.
# This is what lets progress events come from the code that did the work.
aether = { path = "../core/aether" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process"] }
tokio-util = "0.7"

# Userspace TCP/IP stack: turns raw TUN packets back into TCP and UDP flows.
ipstack = "1.0"

log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
dirs = "5"

[target.'cfg(windows)'.dependencies]
# Wintun-backed TUN device. `async` gives us AsyncRead/AsyncWrite, which is what
# ipstack consumes.
tun = { version = "0.8", features = ["async"] }
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Networking_WinInet",
] }

[features]
# Tauri's default CSP is enforced in production; this mirrors the upstream template.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The core pulls in boringssl and quiche, so the binary is large by default.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
