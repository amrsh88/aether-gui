name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap gate: catches type errors before spending twenty minutes on a Windows
  # runner compiling BoringSSL.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build

  windows:
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      # The core is a path dependency, not a submodule, so it is cloned here.
      - name: Clone the Aether core
        run: git clone --depth 1 https://github.com/CluvexStudio/Aether.git desktop/core

      - name: Fetch wintun.dll
        shell: pwsh
        run: |
          $url = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $expected = "e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce"

          Invoke-WebRequest $url -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-extract

          $dll = "wintun-extract/wintun/bin/amd64/wintun.dll"
          $actual = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()

          # A silently-swapped driver DLL is worth failing the build over.
          if ($actual -ne $expected) {
            throw "wintun.dll checksum mismatch: got $actual"
          }

          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Copy-Item $dll desktop/src-tauri/resources/wintun.dll

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # BoringSSL, via quiche, needs CMake, NASM and Perl. The Windows runner
      # ships CMake and Strawberry Perl; NASM it does not.
      - name: Install NASM
        run: choco install nasm --no-progress -y

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - name: Check formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the installers
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: aether-gui-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # A tagged push becomes a draft release; the notes are written by hand.
      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
